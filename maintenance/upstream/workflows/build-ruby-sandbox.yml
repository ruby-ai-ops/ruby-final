name: Build & Test (ruby-sandbox)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      ruby-sandbox-changed: ${{ steps.changes.outputs.ruby-sandbox }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for relevant changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            ruby-sandbox:
              - 'cli/ruby-sandbox/**'
              - '.github/workflows/build-ruby-sandbox.yml'

      - name: Workflow Decision Summary
        env:
          RUBY_SANDBOX_CHANGES: ${{ steps.changes.outputs.ruby-sandbox }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${RUBY_SANDBOX_CHANGES}" == "true" ]; then
            echo "Workflow Decision: RUNNING TESTS"
            echo "ruby-sandbox changes detected vs ${DEFAULT_BRANCH} - running tests"
          else
            echo "Workflow Decision: SKIPPING TESTS"
            echo "No ruby-sandbox changes vs ${DEFAULT_BRANCH} - skipping tests"
          fi

  test:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.ruby-sandbox-changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf # 1.94.1
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: cli/ruby-sandbox

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build functions runner bundle
        # runner.js is a generated bundle (not committed); rbx embeds it via
        # include_str!, so it must exist before any cargo compile (clippy/build/test).
        working-directory: cli/ruby-sandbox/functions-runner
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Lint
        working-directory: cli/ruby-sandbox
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: cli/ruby-sandbox
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        working-directory: cli/ruby-sandbox
        run: cargo build

      - name: Test
        working-directory: cli/ruby-sandbox
        run: cargo test --all

      - name: E2E (local)
        working-directory: cli/ruby-sandbox
        # The e2e harness spawns subprocess listeners and shared local proxy/upstream fixtures.
        run: cargo test --test e2e_local -- --test-threads=1 --nocapture

      - name: Test functions runner
        # The runner's logic lives in TypeScript; cargo never executes the bundle,
        # so its bun:test suite is the only coverage of protocol/invoke/schema/runner.
        working-directory: cli/ruby-sandbox/functions-runner
        run: bun test

      - name: Test pod package
        # @ruby-ai/pod ships into the sandbox image as a bun bundle; its bun:test
        # suite is the only coverage of db()'s open/pragma/quota/error logic.
        working-directory: cli/ruby-sandbox/pod
        run: |
          bun install --frozen-lockfile
          bun test

      - name: Build pod package bundle
        # Mirrors the sandbox-image vendor step (bun build index.ts --bundle
        # --target=bun --packages=external) so bundle regressions surface here
        # instead of at image build time.
        working-directory: cli/ruby-sandbox/pod
        run: bun run build
