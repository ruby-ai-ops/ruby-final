name: Ruby sandbox artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 91892c6dc38c2b24ffb271ec027ae1a1ad996660
          path: .artifacts/codex-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf
        with:
          targets: x86_64-unknown-linux-musl
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config cmake
      - working-directory: cli/ruby-sandbox/functions-runner
        run: bun install --frozen-lockfile && bun run build
      - working-directory: cli/ruby-sandbox
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - working-directory: .artifacts/codex-source/codex-rs
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p codex-apply-patch
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: node maintenance/upstream/package-sandbox-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ruby-sandbox-${{ github.sha }}
          path: .artifacts/sandbox/
          if-no-files-found: error
          retention-days: 30
