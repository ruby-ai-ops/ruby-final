name: Ruby CI
on:
  push:
    branches: [ruby/rebrand]
  pull_request:
    branches: [ruby-main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruby-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=6144
  NEXT_PUBLIC_RUBY_API_URL: https://app.ruby.ad
  NEXT_PUBLIC_RUBY_APP_URL: https://app.ruby.ad
  NEXT_PUBLIC_RUBY_STATIC_WEBSITE_URL: https://ruby.ad
jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      product_changed: ${{ steps.changes.outputs.product_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: node --test maintenance/upstream/*.test.mjs
      - run: node maintenance/upstream/check.mjs
      - name: Verify Ruby boundaries against production
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: node maintenance/upstream/check-boundaries.mjs
      - name: Verify transformation is a no-op
        run: |
          node maintenance/upstream/rebrand.mjs
          git diff --exit-code
      - id: changes
        # Compare the complete candidate with production, never only its last commit.
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: node maintenance/upstream/ci-changes.mjs
  packages:
    needs: policy
    if: needs.policy.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-node-deps
        with:
          build-sdks: 'true'
          build-ui: 'true'
      - run: node maintenance/upstream/check-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ruby-packages
          path: |
            ui/dist/
            sdks/js/dist/
          retention-days: 1
  javascript:
    needs: [policy, packages]
    if: needs.policy.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [front, front-api, front-spa, marketing, connectors, extension, viz, cli]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ruby-packages
      - run: node maintenance/upstream/build-component.mjs '${{ matrix.component }}'
        env:
          FRONT_DATABASE_URI: postgres://test:test@localhost:5433/front_test
          CONNECTORS_DATABASE_URI: postgres://test:test@localhost:5433/connectors_test
      - run: node maintenance/upstream/check-artifacts.mjs
  contracts:
    needs: [policy, packages]
    if: needs.policy.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14.13
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: front_test
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2.5
        ports: ['5434:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ruby-packages
      - run: npm -w sdks/js test
      - name: Fresh database, auth, API configuration, admin and sandbox contracts
        working-directory: front
        env:
          NODE_ENV: test
          FRONT_DATABASE_URI: postgres://test:test@localhost:5433/front_test
          REDIS_URI: redis://localhost:5434
          REDIS_CACHE_URI: redis://localhost:5434
        run: npx vitest run lib/api/config.test.ts lib/api/workos_authenticator.test.ts lib/api/admin/cloudflare_access.test.ts lib/api/admin/from_ruby_super_user.test.ts lib/api/sandbox/image/registry.test.ts lib/api/sandbox/image/artifacts.test.ts temporal/agent_loop/config.test.ts lib/dev/ruby_hive_seed_schema.test.ts lib/metronome/setup_new_pricing.test.ts lib/metronome/seat_types.test.ts lib/api/users/spend_limit.test.ts
      - name: Checkout pricing cases
        working-directory: front-api
        env:
          NODE_ENV: test
          FRONT_DATABASE_URI: postgres://test:test@localhost:5433/front_test
          REDIS_URI: redis://localhost:5434
          REDIS_CACHE_URI: redis://localhost:5434
        run: npx vitest run 'routes/w/[wId]/subscriptions/index.test.ts'
      - run: npx vitest run --config marketing/vitest.config.mjs marketing/hooks/useSignUpModal.test.tsx
  rust:
    needs: policy
    if: needs.policy.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [core, egress-proxy, cli/ruby-sandbox]
    services:
      postgres:
        image: postgres:14.13
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oauth
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2.5
        ports: ['5434:6379']
    env:
      OAUTH_DATABASE_URI: postgres://test:test@localhost:5433/oauth
      REDIS_URI: redis://localhost:5434
      DISABLE_API_KEY_CHECK: 'true'
      OAUTH_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      OAUTH_SLACK_CLIENT_ID: test_slack_client_id
      OAUTH_SLACK_CLIENT_SECRET: test_slack_client_secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf
        with:
          toolchain: '1.94.1'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ${{ matrix.component }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config cmake
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.component == 'cli/ruby-sandbox'
        with:
          bun-version: '1.3.14'
      - if: matrix.component == 'cli/ruby-sandbox'
        working-directory: cli/ruby-sandbox/functions-runner
        run: bun install --frozen-lockfile && bun run build && bun test
      - if: matrix.component == 'core'
        working-directory: core
        run: cargo run --locked --bin init_db
      - working-directory: ${{ matrix.component }}
        run: cargo test --locked --all
  gate:
    name: Ruby release gate
    if: always()
    needs: [policy, packages, javascript, contracts, rust]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
