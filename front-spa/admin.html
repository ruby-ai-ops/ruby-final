<!doctype html>
<html lang="en" data-ruby-admin>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/favicon180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruby - Admin</title>
    <link rel="preload" href="/static/fonts/Sohne-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <style>
      #loading {
        --loading-logo-size: 48px;
        --loading-header-height: 84px;
        --loading-gap: 10px;
        --loading-text-size: 11px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        opacity: 1;
        pointer-events: none;
      }
      #loading.hidden {
        display: none;
      }
      #loading-header {
        height: var(--loading-header-height);
        background-color: rgb(247, 247, 247);
        flex-shrink: 0;
      }
      #loading-main {
        flex: 1;
        position: relative;
        background-color: rgb(247, 247, 247);
      }
      #loading-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(
          calc(var(--loading-logo-size) / -2),
          calc((var(--loading-logo-size) + var(--loading-gap) + var(--loading-text-size)) / -2)
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--loading-gap);
      }
      #loading-logo {
        width: var(--loading-logo-size);
        height: var(--loading-logo-size);
      }
      #loading-text {
        line-height: 1;
        font-family: Sohne, system-ui, sans-serif;
        font-size: var(--loading-text-size);
        color: #64748b;
        opacity: 0;
        animation:
          loading-fade-in 300ms ease-out 2s forwards,
          loading-breathing 3s ease-in-out 2.3s infinite;
      }
      @keyframes loading-breathing {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      @keyframes loading-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .dark #loading-header {
        background-color: #181818;
      }
      .dark #loading-main {
        background-color: #1e1e1e;
      }
      .dark #loading-text {
        color: #8e8e8d;
      }
    </style>

    <div id="root"></div>
    <div id="loading">
      <div id="loading-header"></div>
      <div id="loading-main">
        <div id="loading-content">
          <img id="loading-logo" src="/static/favicon180.png" alt="Ruby AI" />
          <span id="loading-text">Loading...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
